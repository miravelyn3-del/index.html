<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>همبندی‌های شبکه — انیمیشن</title>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#0F172A;--mute:#64748B;--line:#CBD5E1;--teal:#0891B2;--coral:#E8502E;--ok:#059669;--warn:#B45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:24px;margin:4px 0 0;font-weight:600}
#tag{margin:2px 0 12px;color:var(--mute);font-size:15px;min-height:50px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:8px 4px}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.stage,#stage{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
[hidden]{display:none!important}
.cvw{background:#FFFFFF}
#mmsg{min-height:52px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
#mmsg.ok{color:var(--ok)}#mmsg.bad{color:var(--coral)}
#mtag{margin:2px 0 12px;color:var(--mute);font-size:15px}
.leg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px;margin-top:16px;align-items:center}
.leg span{display:flex;align-items:center;gap:6px}
canvas{display:block;width:100%;aspect-ratio:10/9}
#msg{min-height:84px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
#msg.ok{color:var(--ok)}#msg.warn{color:var(--warn)}#msg.bad{color:var(--coral)}
#st{display:block;margin-top:4px;font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{font:inherit;font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.f{background:var(--coral);border-color:var(--coral);color:#fff;flex:1}
.f:disabled{opacity:.45;cursor:default}
#leg{color:var(--mute);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>همبندی‌های شبکه</h1>
  <div class="tabs" id="tabs"></div>
  <div id="topoView">
  <p id="tag"></p>
  <div id="stage">
    <canvas id="c" width="1000" height="900" aria-label="انیمیشن همبندی شبکه"></canvas>
    <div id="msg" aria-live="polite"></div>
  </div>
  <div class="row" id="fails"></div>
  <div id="leg"></div>
  </div>
  <div id="meshView" hidden>
  <p id="mtag">همه با همه وصلن. چند گره بیفته، بسته‌ها راه دیگه‌ای پیدا می‌کنن.</p>
  <div class="stage">
    <div class="cvw"><canvas id="mc" width="1000" height="900" aria-label="نمای سه‌بعدی همبندی مش"></canvas></div>
    <div id="mmsg" aria-live="polite"></div>
  </div>
  <div class="row">
    <button id="mfail" class="f">یه گره (مگس) رو خراب کن</button>
    <button id="mreset">بازنشانی</button>
  </div>
  <div class="leg">
    <span><svg width="34" height="22" viewBox="0 0 64 30"><ellipse cx="18" cy="11" rx="15" ry="6" transform="rotate(-20 18 11)" fill="#bae6fd" stroke="#0e7490"/><ellipse cx="46" cy="11" rx="15" ry="6" transform="rotate(20 46 11)" fill="#bae6fd" stroke="#0e7490"/><ellipse cx="32" cy="19" rx="4" ry="9" fill="#475569"/></svg>مگس = گره</span>
    <span><svg width="30" height="10" viewBox="0 0 30 10"><line x1="1" y1="5" x2="29" y2="5" stroke="#7a8496" stroke-width="3" stroke-linecap="round"/></svg>تار = اتصال</span>
    <span><svg width="30" height="22" viewBox="0 0 44 30"><circle cx="22" cy="15" r="14" fill="#f59e0b" opacity=".3"/><path d="M18 13l-8-6M18 15l-10 0M18 17l-8 6M26 13l8-6M26 15l10 0M26 17l8 6" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="22" cy="17" rx="5" ry="7" fill="#1f2937"/><circle cx="22" cy="9" r="3.5" fill="#334155"/></svg>عنکبوت = بسته‌ی داده</span>
  </div>
</div>
</main>
<script>
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d');
const fa=n=>n.toLocaleString('fa-IR'), PI=Math.PI;
const COL=['#0e7490','#0891b2','#06b6d4','#2563eb','#3b82f6','#6366f1','#0d9488','#14b8a6'];
const D={
 star:{t:'ستاره',pk:'mail',tag:'هواپیماها فقط با برج کنترل حرف می‌زنن؛ هر پیام از برج رد می‌شه.',
  leg:'برج کنترل = هاب (سوئیچ) · هواپیما = گره · رادیو = اتصال · پیام = بسته‌ی داده',
  fails:[{l:'یه هواپیما خراب شه',k:['plane'],m:'یه هواپیما خراب شد. بقیه هنوز از طریق برج با هم حرف می‌زنن.'},
         {l:'برج کنترل خراب شه',k:['tower'],m:'برج کنترل خراب شد! هواپیماها سالمن، ولی هیچ‌کدوم به بقیه نمی‌رسن.'}]},
 tree:{t:'درخت',pk:'fruit',tag:'پیام از برگ‌ها بالا می‌ره و از شاخه‌ها پایین میاد.',
  leg:'ریشه = سوئیچ اصلی · گروه شاخه = سوئیچ · برگ = گره · شاخه = اتصال · میوه = بسته‌ی داده',
  fails:[{l:'یه برگ بیفته',k:['leaf'],m:'یه برگ افتاد. بقیه‌ی درخت دست‌نخورده کار می‌کنه.'},
         {l:'یه گروه شاخه خراب شه',k:['sw'],m:'یه سوئیچ شاخه خراب شد. برگ‌های زیرش قطع شدن، ولی بقیه‌ی درخت ادامه می‌ده.'},
         {l:'ریشه خراب شه',k:['root'],m:'ریشه خراب شد! درخت دو تکه شد: هر نیمه داخل خودش کار می‌کنه، ولی بین دو نیمه ارتباطی نیست.'}]},
 bus:{t:'باس',pk:'car',tag:'همه‌ی خونه‌ها به یک خیابان مشترک وصلن و ماشین بسته رو می‌بره.',
  leg:'خیابان = کابل اصلی · خونه = گره · ماشین = بسته‌ی داده',
  fails:[{l:'یه خونه خراب شه',k:['house'],m:'یه خونه خراب شد. بقیه هنوز از همون خیابان استفاده می‌کنن.'},
         {l:'خیابان خراب شه',k:['tap'],all:1,m:'خیابان (کابل اصلی) خراب شد! خونه‌ها سالمن، ولی راهی به هم ندارن.'}]},
 ring:{t:'حلقه',pk:'ball',tag:'توپ دور حلقه می‌چرخه و هر بچه فقط به بغلی می‌ده.',
  leg:'بچه = گره · مسیر دایره = اتصال · توپ = بسته‌ی داده',
  fails:[{l:'یه بچه خراب شه',k:['kid'],m:'یه بچه رفت! توپ بهش می‌رسه و می‌افته؛ چون راه دیگه‌ای نیست، بازی برای همه می‌ایسته.'}]}
};
let K,N,E,adj,pk,ball,pulses,cool,road,msgEl=$('msg');
const nd=(k,x,y,end,o={})=>({k,x,y,end,ok:true,cut:false,dt:-9,col:'#ef4444',rot:0,...o});
const B={
 star(){const n=[nd('tower',500,440,false)],e=[];
  for(let i=0;i<6;i++){const a=i*PI/3-PI/2;n.push(nd('plane',500+390*Math.cos(a),450+340*Math.sin(a),true,{rot:a}));e.push([0,i+1]);}
  return[n,e];},
 tree(){const n=[],e=[],lx=i=>90+i*117.1;
  n.push(nd('root',500,110,false));
  [[0,3],[4,7]].forEach(([a,b],i)=>n.push(nd('sw',(lx(a)+lx(b))/2,290,false)));
  for(let i=0;i<4;i++)n.push(nd('sw',(lx(2*i)+lx(2*i+1))/2,480,false));
  for(let i=0;i<8;i++)n.push(nd('leaf',lx(i),720,true));
  [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]].forEach(x=>e.push(x));
  for(let i=0;i<8;i++)e.push([3+(i>>1),7+i]);
  return[n,e];},
 bus(){const n=[],e=[];
  for(let i=0;i<5;i++)n.push(nd('tap',200+i*150,450,false));
  for(let i=0;i<5;i++)n.push(nd('house',200+i*150,i%2?710:190,true,{col:COL[i],up:i%2===0}));
  for(let i=0;i<4;i++)e.push([i,i+1,1]);
  for(let i=0;i<5;i++)e.push([i,5+i]);
  return[n,e];},
 ring(){const n=[],e=[];
  for(let i=0;i<6;i++){const a=i*PI/3-PI/2;n.push(nd('kid',500+330*Math.cos(a),450+330*Math.sin(a),true,{col:COL[i%8],a}));e.push([i,(i+1)%6]);}
  return[n,e];}
};
function load(name){
  $('topoView').hidden=false;$('meshView').hidden=true;
  K=D[name];[N,E]=B[name]();
  adj=N.map(()=>[]);E.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});
  pk=null;pulses=[];cool=0.6;ball={i:0,s:0,wait:0.6,fall:0};
  $('tag').textContent=K.tag;$('leg').textContent=K.leg;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===name));
  const f=$('fails');f.innerHTML='';
  K.fails.forEach(F=>{const b=document.createElement('button');b.className='f';b.textContent=F.l;b.onclick=()=>kill(F,b);f.appendChild(b);});
  const r=document.createElement('button');r.textContent='بازنشانی';r.onclick=()=>load(name);f.appendChild(r);
  K.name=name;setMsg('همه‌ی گره‌ها سالمن و با هم وصلن.');
}
function setMsg(t,c,s){msgEl.className=c||'';msgEl.innerHTML='';msgEl.append(t);if(s){const x=document.createElement('span');x.id='st';x.textContent=s;msgEl.append(x);}}
function bfs(a,b){const p={[a]:-1},q=[a];
  while(q.length){const u=q.shift();if(u===b)break;for(const v of adj[u])if(N[v].ok&&!(v in p)){p[v]=u;q.push(v);}}
  if(!(b in p))return null;const r=[];for(let u=b;u!==-1;u=p[u])r.unshift(u);return r;}
function kill(F,btn){
  let pool=N.map((n,i)=>n.ok&&F.k.includes(n.k)?i:-1).filter(i=>i>=0);
  if(!pool.length)return;
  if(!F.all)pool=[pool[Math.floor(Math.random()*pool.length)]];
  pool.forEach(i=>{N[i].ok=false;N[i].dt=now;});
  const ends=N.filter(n=>n.end),al=ends.filter(n=>n.ok),dead=ends.length-al.length;
  let w=0;
  al.forEach(a=>{const has=K.name==='ring'?dead===0:al.some(b=>b!==a&&bfs(N.indexOf(a),N.indexOf(b)));a.cut=!has;if(has)w++;});
  const cut=al.length-w;
  setMsg(F.m,w===0?'bad':(cut>0?'warn':'ok'),`کار می‌کنن: ${fa(w)} · قطع‌شده: ${fa(cut)} · خراب: ${fa(dead)}`);
  if(F.k.length&&!K.fails.some(x=>N.some(n=>n.ok&&x.k.includes(n.k)))){}
  btn.disabled=!N.some(n=>n.ok&&F.k.includes(n.k));
}
/* ---------- حرکت بسته‌ها ---------- */
let now=0,last=0;
function newPacket(){
  const a=N.map((n,i)=>n.end&&n.ok?i:-1).filter(i=>i>=0);
  const pr=[];a.forEach(x=>a.forEach(y=>{if(x!==y)pr.push([x,y]);}));
  pr.sort(()=>Math.random()-.5);
  for(const[x,y]of pr){const p=bfs(x,y);if(p){pk={path:p,seg:0,s:0,fall:0};return;}}
  cool=0.5;
}
function upd(dt,t){
  if(K.name==='ring'){
    if(ball.fall){ball.fall+=dt;return;}
    if(ball.wait>0){ball.wait-=dt;if(!N[ball.i].ok)ball.fall=0.001;return;}
    ball.s+=dt*300/(330*PI/3);
    const j=(ball.i+1)%6;
    if(ball.s>=1){ball.s=1;
      if(!N[j].ok){ball.fall=0.001;ball.i=j;ball.s=0;return;}
      pulses.push({x:N[j].x,y:N[j].y,t0:t});ball.i=j;ball.s=0;ball.wait=0.2;}
    return;}
  if(cool>0){cool-=dt;if(cool<=0)newPacket();return;}
  if(!pk){cool=0.3;return;}
  if(pk.fall){pk.fall+=dt;if(pk.fall>0.8){pk=null;cool=0.4;}return;}
  if(pk.path.some(i=>!N[i].ok)){pk.fall=0.001;return;}
  const a=N[pk.path[pk.seg]],b=N[pk.path[pk.seg+1]];
  pk.s+=dt*340/Math.hypot(b.x-a.x,b.y-a.y);
  if(pk.s>=1){pk.seg++;pk.s=0;
    if(pk.seg>=pk.path.length-1){const d=N[pk.path[pk.seg]];pulses.push({x:d.x,y:d.y,t0:t});pk=null;cool=0.5;}}
}
/* ---------- نقاشی ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function pkt(x,y,type,al=1){
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=al;ctx.lineWidth=3;ctx.strokeStyle='#b45309';ctx.fillStyle='#f59e0b';
  if(type==='car'){rr(-24,-10,48,22,6);ctx.fill();ctx.stroke();rr(-11,-20,22,12,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1e293b';[-13,13].forEach(w=>{ctx.beginPath();ctx.arc(w,12,6,0,7);ctx.fill();});}
  else if(type==='mail'){ctx.fillStyle='#fbbf24';rr(-20,-13,40,26,3);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-20,-13);ctx.lineTo(0,3);ctx.lineTo(20,-13);ctx.stroke();}
  else if(type==='fruit'){ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(4,-24);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(18,0);ctx.moveTo(0,-18);ctx.lineTo(0,18);ctx.stroke();}
  ctx.restore();
}
const S={
 house(n){ctx.lineWidth=3;ctx.fillStyle=n.col;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.moveTo(-38,-8);ctx.lineTo(0,-46);ctx.lineTo(38,-8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#e0f2fe';ctx.strokeStyle='#0369a1';ctx.fillRect(-28,-8,56,50);ctx.strokeRect(-28,-8,56,50);ctx.fillStyle='#7dd3fc';ctx.fillRect(-7,12,14,30);ctx.strokeRect(-7,12,14,30);},
 plane(n){ctx.rotate(n.rot);ctx.lineWidth=3;ctx.fillStyle='#e2e8f0';ctx.strokeStyle='#475569';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-10,s*38);ctx.lineTo(-24,s*38);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();ctx.stroke();
   ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-40,s*14);ctx.lineTo(-33,s*14);ctx.lineTo(-22,0);ctx.closePath();ctx.fill();ctx.stroke();});
  ctx.beginPath();ctx.ellipse(0,0,40,11,0,0,7);ctx.fill();ctx.stroke();},
 tower(){ctx.lineWidth=3;ctx.strokeStyle='#64748b';ctx.fillStyle='#cbd5e1';ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(14,-4);ctx.lineTo(24,72);ctx.lineTo(-24,72);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillRect(-34,72,68,12);ctx.strokeRect(-34,72,68,12);ctx.beginPath();ctx.moveTo(0,-48);ctx.lineTo(0,-72);ctx.stroke();ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(0,-76,6,0,7);ctx.fill();
  ctx.fillStyle='#3b82f6';ctx.strokeStyle='#1d4ed8';rr(-36,-50,72,46,10);ctx.fill();ctx.stroke();ctx.fillStyle='#dbeafe';ctx.fillRect(-26,-42,52,14);},
 root(){ctx.lineWidth=3;ctx.fillStyle='#3b82f6';ctx.strokeStyle='#1d4ed8';rr(-46,-36,92,72,10);ctx.fill();ctx.stroke();ctx.fillStyle='#dbeafe';[-18,0,18].forEach(y=>ctx.fillRect(-30,y-3,60,6));},
 sw(){ctx.lineWidth=3;ctx.fillStyle='#3b82f6';ctx.strokeStyle='#1d4ed8';ctx.beginPath();ctx.arc(0,0,27,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(10,10);ctx.moveTo(10,-10);ctx.lineTo(-10,10);ctx.stroke();},
 leaf(){ctx.lineWidth=3;ctx.fillStyle='#99f6e4';ctx.strokeStyle='#0d9488';ctx.beginPath();ctx.ellipse(0,0,21,32,0,0,7);ctx.fill();ctx.stroke();},
 tap(){ctx.fillStyle='#475569';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();},
 kid(n){ctx.lineWidth=4;ctx.fillStyle='#e0f2fe';ctx.strokeStyle='#0891b2';ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=n.col;ctx.beginPath();ctx.arc(0,28,24,PI,0);ctx.fill();ctx.fillStyle='#fed7aa';ctx.strokeStyle='#c2410c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-9,13,0,7);ctx.fill();ctx.stroke();}
};
function edgeStyle(ok){
  ctx.setLineDash([]);ctx.lineCap='round';
  if(!ok){ctx.strokeStyle='rgba(232,80,46,.4)';ctx.lineWidth=3;ctx.setLineDash([4,10]);return;}
  const n=K.name;
  if(n==='star'){ctx.strokeStyle='#0891b2';ctx.lineWidth=4;ctx.setLineDash([14,10]);ctx.lineDashOffset=-now*40;}
  else if(n==='tree'){ctx.strokeStyle='#0e7490';ctx.lineWidth=9;}
  else if(n==='bus'){ctx.strokeStyle='#64748b';ctx.lineWidth=7;}
  else{ctx.strokeStyle='#64748b';ctx.lineWidth=7;}
}
function draw(t){
  if(K.name==='bus'){const ok=N[0].ok;
    ctx.fillStyle=ok?'#94a3b8':'#475569';rr(90,420,820,60,8);ctx.fill();
    ctx.strokeStyle=ok?'#f1f5f9':'#E8502E';ctx.lineWidth=4;ctx.setLineDash([26,22]);ctx.lineDashOffset=0;ctx.beginPath();ctx.moveTo(110,450);ctx.lineTo(890,450);ctx.stroke();ctx.setLineDash([]);}
  E.forEach(([a,b,r])=>{
    if(r)return;const A=N[a],Bn=N[b],ok=A.ok&&Bn.ok;edgeStyle(ok);ctx.beginPath();
    if(K.name==='ring'){ctx.arc(500,450,330,A.a,A.a+PI/3);}else{ctx.moveTo(A.x,A.y);ctx.lineTo(Bn.x,Bn.y);}
    ctx.stroke();ctx.setLineDash([]);});
  N.forEach(n=>{
    const age=Math.min(1,(t-n.dt)/0.5);let al=n.ok?(n.cut?0.55:1):1-0.7*age;
    ctx.save();ctx.globalAlpha=al;ctx.translate(n.x+(n.ok?0:Math.sin(age*40)*(1-age)*5),n.y);S[n.k](n);ctx.restore();
    if(!n.ok){ctx.save();ctx.globalAlpha=age;ctx.strokeStyle='#E8502E';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(n.x-24,n.y-24);ctx.lineTo(n.x+24,n.y+24);ctx.moveTo(n.x+24,n.y-24);ctx.lineTo(n.x-24,n.y+24);ctx.stroke();ctx.restore();}
    else if(n.cut){ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=4;ctx.setLineDash([10,8]);ctx.lineDashOffset=-t*20;ctx.beginPath();ctx.arc(n.x,n.y,58,0,7);ctx.stroke();ctx.restore();}
  });
  if(K.name==='ring'){
    const a=N[ball.i].a+PI/3*ball.s;let x=500+330*Math.cos(a),y=450+330*Math.sin(a);
    if(ball.fall)y+=700*ball.fall*ball.fall;
    if(y<1000)pkt(x,y,'ball',ball.fall?Math.max(0,1-ball.fall):1);
  }else if(pk){
    const A=N[pk.path[pk.seg]],Bn=N[pk.path[pk.seg+1]];let x=A.x+(Bn.x-A.x)*pk.s,y=A.y+(Bn.y-A.y)*pk.s;
    if(pk.fall)y+=500*pk.fall*pk.fall;
    pkt(x,y,K.pk,pk.fall?Math.max(0,1-pk.fall*1.2):1);
  }
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i],a=(t-p.t0)/0.8;if(a>=1){pulses.splice(i,1);continue;}
    ctx.strokeStyle=`rgba(245,158,11,${1-a})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,30+60*a,0,7);ctx.stroke();}
}
function frame(ms){const t=ms/1000;now=t;const dt=Math.min(.05,last?t-last:.016);last=t;
  upd(dt,t);ctx.clearRect(0,0,1000,900);draw(t);requestAnimationFrame(frame);}
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].t;b.dataset.k=k;b.onclick=()=>load(k);$('tabs').appendChild(b);});
{const b=document.createElement('button');b.textContent='مش';b.dataset.k='mesh';
 b.onclick=()=>{$('topoView').hidden=true;$('meshView').hidden=false;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));};$('tabs').appendChild(b);}
load('star');requestAnimationFrame(frame);
</script>
<script>
(function(){

const cv=document.getElementById('mc'), ctx=cv.getContext('2d');
const S=112, D=14, CX=500, CY=450, PI=Math.PI;
let yaw=0.6, pitch=0.35, auto=true, now=0;

/* ---------- ریاضی سه‌بعدی ---------- */
function rotate([x,y,z]){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1=x*cy+z*sy, z1=-x*sy+z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return [x1, y*cp+z1*sp, -y*sp+z1*cp];
}
function P(p){const [x,y,z]=rotate(p), f=D/(D-z); return {x:CX+x*S*f, y:CY-y*S*f, z, f};}
function mix(hex,to,a){
  const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  const A=h(hex),B=h(to);
  return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*a)).join(',')+')';
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const fa=n=>n.toLocaleString('fa-IR');
// هرچی دورتر، کم‌رنگ‌تر؛ این کار شلوغی رو خیلی کم می‌کنه
const fade=z=>0.5+0.5*Math.max(0,Math.min(1,(z+3)/6));

/* ---------- صف رسم ---------- */
let items=[], solid=false;
const add=(z,d)=>items.push({z,d,s:solid});
function seg(a,b,w,col,dash){
  const p=P(a),q=P(b), f=(p.f+q.f)/2;
  add((p.z+q.z)/2,()=>{
    ctx.strokeStyle=col; ctx.lineWidth=w*f; ctx.lineCap='round';
    ctx.setLineDash(dash?dash.map(v=>v*f):[]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); ctx.setLineDash([]);
  });
}
function sphere(c,r,col){
  const q=P(c);
  add(q.z,()=>{
    const rr=r*S*q.f;
    const g=ctx.createRadialGradient(q.x-rr*.35,q.y-rr*.4,rr*.1,q.x,q.y,rr);
    g.addColorStop(0,mix(col,'#ffffff',.45)); g.addColorStop(1,col);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,rr,0,7); ctx.fill();
  });
}
function poly(pts,fill,stroke,lw,bias=0){
  const q=pts.map(P), z=q.reduce((s,p)=>s+p.z,0)/q.length+bias;
  add(z,()=>{
    ctx.beginPath(); q.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw*q[0].f;ctx.stroke();}
  });
}

/* ---------- وضعیت ---------- */
const R=2.5;
const HOME=[[0,R,0],[0,-R,0],[R,0,0],[-R,0,0],[0,0,R],[0,0,-R]];
let flies, edges, spider, pulses;
const stEl=document.getElementById('mmsg'), killBtn=document.getElementById('mfail');
const aliveIdx=()=>flies.map((f,i)=>f.alive?i:-1).filter(i=>i>=0);
const setMsg=(t,c)=>{stEl.textContent=t;stEl.className=c||'';};

function init(){
  flies=HOME.map((h,i)=>({h,x:h[0],y:h[1],z:h[2],ph:i*1.9,buzz:0,alive:true,dt:0,
    w:[0.6+0.07*i,0.5+0.05*i,0.42+0.09*i]}));
  edges=[];
  for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)
    edges.push({i,j,vib:0,dead:null,diag:(i>>1)===(j>>1)}); // سه قطر وسط، کم‌رنگ‌تر کشیده می‌شن
  spider={from:0,to:2,s:0,ph:0,speed:1.5,fall:false,wait:0.4,fc:null,ff:[0,0,1],fd:0,fv:0};
  pulses=[];
  killBtn.disabled=false;
  setMsg('همه‌ی ۶ مگس سالمن و با هم وصلن. با انگشت بکش تا بچرخه.');
}
const edgeOf=(a,b)=>edges.find(e=>(e.i===a&&e.j===b)||(e.i===b&&e.j===a));
const edgeAlive=e=>flies[e.i].alive&&flies[e.j].alive;

function moveFlies(t){
  flies.forEach(f=>{
    const A=0.16;
    f.x=f.h[0]+A*Math.sin(f.w[0]*t+f.ph);
    f.y=f.h[1]+A*Math.sin(f.w[1]*t+f.ph*1.3)+0.03*Math.sin(t*3+f.ph);
    f.z=f.h[2]+A*Math.sin(f.w[2]*t+f.ph*0.7);
    f.buzz=Math.max(0,f.buzz-0.012);
    if(!f.alive){const a=t-f.dt; f.y-=2.6*a*a; f.x+=0.2*a;}
  });
}

/* ---------- مگس ---------- */
const FS=1.25;
function drawFly(f,t){
  const dead=!f.alive;
  if(dead&&t-f.dt>1.5)return;
  const body=dead?'#9ca3af':'#475569', head=dead?'#8b93a1':'#3f4d63', eye=dead?'#6b7280':'#ef4444';
  const at=(lx,ly,lz=0)=>[f.x+lx*FS,f.y+ly*FS,f.z+lz*FS];
  [-0.2,-0.08,0.04,0.14].forEach((y,i)=>sphere(at(0,y),0.07*FS*(1-i*0.04),body));
  sphere(at(0,0.23),0.08*FS,head);
  [-1,1].forEach(s=>sphere(at(s*0.05,0.26,0.05),0.03*FS,eye));
  const flap=dead?1.35:0.45+(0.35+f.buzz*0.4)*Math.sin(t*(11+f.buzz*14)+f.ph);
  [1,-1].forEach(side=>{
    const ang=22*PI/180, dx=Math.cos(ang), dy=Math.sin(ang), a=0.22, b=0.085, pts=[];
    for(let k=0;k<20;k++){
      const th=k/20*2*PI, u=a+a*Math.cos(th), v=b*Math.sin(th);
      const px=(dx*u-dy*v)+0.03, py=(dy*u+dx*v)+0.08;
      pts.push([f.x+side*px*Math.cos(flap)*FS, f.y+py*FS, f.z+0.06*FS+px*Math.sin(flap)*FS]);
    }
    poly(pts,dead?'rgba(180,185,195,0.6)':'rgba(186,230,253,0.72)',dead?'#6b7280':'#0e7490',1.3,0.02);
  });
}

/* ---------- تارها ---------- */
function threadPt(a,b,s,t,vib){
  const A=flies[a],B=flies[b];
  const len=Math.hypot(B.x-A.x,B.y-A.y,B.z-A.z);
  const k=4*s*(1-s);
  const wob=vib*0.08*Math.sin(PI*s)*Math.sin(t*22+s*5);
  return [A.x+(B.x-A.x)*s+wob, A.y+(B.y-A.y)*s-0.06*len*k+wob, A.z+(B.z-A.z)*s];
}
function drawThreads(t){
  edges.forEach(e=>{
    const ok=edgeAlive(e);
    if(!ok){
      if(e.dead===null)e.dead=t;
      const age=(t-e.dead)/0.8;
      if(age>=1)return;
      let prev=threadPt(e.i,e.j,0,t,0);
      for(let k=1;k<=10;k++){
        const cur=threadPt(e.i,e.j,k/10,t,0);
        seg(prev,cur,2,`rgba(232,80,46,${0.7*(1-age)})`,[6,8]);
        prev=cur;
      }
      return;
    }
    const hot=e.vib>0.05;
    const w=e.diag?1.4:(hot?3:2.2);
    const col=e.diag?'rgba(122,132,150,.55)':(hot?'#566072':'#7a8496');
    let prev=threadPt(e.i,e.j,0,t,e.vib);
    for(let k=1;k<=14;k++){
      const cur=threadPt(e.i,e.j,k/14,t,e.vib);
      seg(prev,cur,w,col);
      prev=cur;
    }
  });
}

/* ---------- عنکبوت (فقط یکی) ---------- */
const BZ=0.22, SP=0.72;
const LEGS=[
  [[0.22,0.26],[0.61,0.69],[1.03,0.59]],
  [[0.17,0.11],[0.76,0.26],[1.23,0.04]],
  [[0.22,-0.09],[0.78,-0.32],[1.17,-0.66]],
  [[0.30,-0.35],[0.62,-0.80],[0.87,-1.17]],
];
function drawSpider(sp,t){
  solid=true; // عنکبوت همیشه کامل و واضح دیده می‌شه
  let c,f;
  if(sp.fall){
    c=[sp.fc[0],sp.fc[1]-sp.fd,sp.fc[2]]; f=sp.ff;
  }else{
    const e=edgeOf(sp.from,sp.to); if(sp.wait<=0)e.vib=1;
    const s=sp.s;
    c=threadPt(sp.from,sp.to,s,t,e.vib);
    const c1=threadPt(sp.from,sp.to,Math.min(1,s+0.02),t,e.vib);
    const c0=threadPt(sp.from,sp.to,Math.max(0,s-0.02),t,e.vib);
    f=norm(sub(c1,c0));
    sp.fc=c; sp.ff=f;
  }
  let up0=[0,1,0];
  if(Math.abs(f[1])>0.95) up0=[1,0,0];
  const r=norm(cross(f,up0)), u=cross(r,f);
  const L=(side,fw,up)=>[
    c[0]+(r[0]*side+f[0]*fw+u[0]*up)*SP,
    c[1]+(r[1]*side+f[1]*fw+u[1]*up)*SP,
    c[2]+(r[2]*side+f[2]*fw+u[2]*up)*SP];

  const q=P(L(0,-0.1,BZ));
  add(q.z-0.25,()=>{
    const Rr=0.75*SP*S*q.f*1.5;
    const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,Rr);
    g.addColorStop(0,'rgba(245,158,11,0.4)'); g.addColorStop(1,'rgba(245,158,11,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,Rr,0,7); ctx.fill();
  });
  for(let i=0;i<=10;i++){
    const u_=-1+0.2*i;
    sphere(L(0,-0.3+0.36*u_,BZ),Math.max(0.07,0.3*Math.sqrt(1-u_*u_))*SP,'#1f2937');
  }
  const mark=[];
  for(let k=0;k<18;k++){
    const a=k/18*2*PI, x=0.075*Math.cos(a), y=-0.28+0.13*Math.sin(a);
    const zz=BZ+0.3*Math.sqrt(Math.max(0,1-(x/0.3)**2-((y+0.3)/0.36)**2))+0.012;
    mark.push(L(x,y,zz));
  }
  poly(mark,'#E8502E',null,0,0.05);
  sphere(L(0,0.2,BZ),0.17*SP,'#334155');
  [-1,1].forEach(sd=>{
    sphere(L(sd*0.07,0.27,BZ+0.13),0.05*SP,'#ffffff');
    sphere(L(sd*0.07,0.28,BZ+0.17),0.022*SP,'#111827');
  });
  const rate=sp.fall?26:(sp.wait>0?0:9);
  LEGS.forEach((leg,i)=>{
    [1,-1].forEach(side=>{
      const ph=sp.ph+i*1.3+(side>0?0:PI);
      const w=rate?Math.sin(t*rate+ph):0;
      const A=L(side*leg[0][0],leg[0][1],BZ);
      const M=L(side*leg[1][0],leg[1][1]+0.1*w,0.62+0.12*Math.max(0,w));
      const E=L(side*leg[2][0],leg[2][1]+0.18*w,-0.05);
      seg(A,M,4.5,'#1f2937'); seg(M,E,4.5,'#1f2937');
    });
  });
  solid=false;
}
function respawn(sp){
  const a=aliveIdx(); if(a.length<2)return;
  sp.from=a[Math.floor(Math.random()*a.length)];
  const o=a.filter(i=>i!==sp.from);
  sp.to=o[Math.floor(Math.random()*o.length)];
  sp.s=0; sp.fall=false; sp.wait=0.4;
}
function updateSpider(dt,t){
  edges.forEach(e=>{e.vib*=0.96;});
  const sp=spider;
  if(sp.fall){
    sp.fv+=dt*10; sp.fd+=sp.fv*dt;
    if(sp.fd>3.4)respawn(sp);
    return;
  }
  if(sp.wait>0){sp.wait-=dt;return;}
  const A=flies[sp.from],B=flies[sp.to];
  const len=Math.hypot(B.x-A.x,B.y-A.y,B.z-A.z)||1;
  sp.s+=dt*sp.speed/len;
  if(sp.s>=1){
    flies[sp.to].buzz=1;
    pulses.push({fly:sp.to,t0:t});
    const a=aliveIdx().filter(i=>i!==sp.to);
    let n=a[Math.floor(Math.random()*a.length)];
    if(n===sp.from&&a.length>1&&Math.random()<0.75)n=a.find(i=>i!==sp.from)??n;
    sp.from=sp.to; sp.to=n; sp.s=0; sp.wait=0.5;
  }
}
function drawPulses(t){
  for(let k=pulses.length-1;k>=0;k--){
    const p=pulses[k], age=(t-p.t0)/0.9;
    if(age>=1){pulses.splice(k,1);continue;}
    const f=flies[p.fly]; if(!f.alive){pulses.splice(k,1);continue;}
    const q=P([f.x,f.y,f.z]);
    add(q.z-0.2,()=>{
      ctx.strokeStyle=`rgba(245,158,11,${1-age})`; ctx.lineWidth=4*q.f;
      ctx.beginPath(); ctx.arc(q.x,q.y,(0.2+1.1*age)*S*q.f,0,7); ctx.stroke();
    });
  }
}

/* ---------- خراب کردن گره ---------- */
function killNode(){
  const a=aliveIdx(); if(a.length<=2)return;
  const i=a[Math.floor(Math.random()*a.length)];
  flies[i].alive=false; flies[i].dt=now;
  const hit=!spider.fall&&(spider.from===i||spider.to===i);
  if(hit){spider.fall=true;spider.fd=0;spider.fv=0;}
  const n=a.length-1;
  if(n<=2){
    killBtn.disabled=true;
    setMsg(`فقط ${fa(n)} مگس مونده، ولی هنوز بهم وصلن.`,'ok');
  }else if(hit){
    setMsg(`یه مگس خراب شد و عنکبوت روی تارش افتاد. ${fa(n)} مگس مونده و بسته از تارهای سالم ادامه می‌ده.`,'ok');
  }else{
    setMsg(`یه مگس خراب شد! ${fa(n)} مگس زنده مونده و بسته از تارهای باقی‌مونده می‌ره.`,'ok');
  }
}

/* ---------- حلقه‌ی اصلی ---------- */
let last=0;
function frame(ms){
  const t=ms/1000; now=t;
  const dt=Math.min(0.05,last?t-last:0.016); last=t;
  if(auto)yaw+=0.003;
  moveFlies(t);
  updateSpider(dt,t);
  ctx.clearRect(0,0,1000,900);
  items=[];
  drawThreads(t);
  flies.forEach(f=>drawFly(f,t));
  drawSpider(spider,t);
  drawPulses(t);
  items.sort((a,b)=>a.z-b.z).forEach(o=>{ctx.globalAlpha=o.s?1:fade(o.z);o.d();});
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
init();
requestAnimationFrame(frame);

/* ---------- کنترل ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX};auto=false;cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-drag.x)*0.009;
  drag={x:e.clientX};
});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{drag=null;cv.style.cursor='grab';}));
killBtn.onclick=killNode;
document.getElementById('mreset').onclick=()=>{init();};

})();
</script>
